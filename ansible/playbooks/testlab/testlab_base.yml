---
# Test Lab — Phase 1: base Windows preparation.
#
# Targets every Windows host in the test lab (DC + member + workstation).
# Establishes the prerequisites that every later phase relies on:
#   - correct hostname (matches inventory key)
#   - DNS pointed at the future DC so domain-join + AD lookups resolve
#   - Defender disabled so bolt-on payloads can land cleanly
#   - Windows Update auto-reboot disabled so a mid-playbook reboot is
#     never surprise-initiated by WU
#   - timezone UTC for consistent event log timestamps
#
# DHCP reservations from the Terraform module assign each host its
# static IP at boot; we only verify that the address we expect is on
# the primary interface — we do NOT rewrite it (avoids losing the
# WinRM session mid-task).

- name: "Test Lab | base | prepare Windows hosts"
  hosts: domain_controllers:member_servers:workstations
  gather_facts: true
  vars:
    # tldc01's private IP — used as the DNS server for every non-DC
    # host. The dashboard inventory generator injects this as a group
    # var so we don't hard-code the IP here.
    testlab_dc_ip: "{{ hostvars[groups['domain_controllers'][0]].ansible_host }}"

  tasks:
    - name: "Test Lab | base | preflight — assert Windows"
      ansible.builtin.assert:
        that:
          - ansible_os_family | default('Windows') == 'Windows'
        fail_msg: "testlab_base only targets Windows hosts."
        success_msg: "Windows host confirmed."

    - name: "Test Lab | base | set hostname to inventory key"
      ansible.windows.win_hostname:
        name: "{{ inventory_hostname }}"
      register: testlab_hostname

    - name: "Test Lab | base | reboot if hostname changed"
      ansible.windows.win_reboot:
        reboot_timeout: 900
        post_reboot_delay: 60
      when: testlab_hostname.reboot_required | default(false)

    - name: "Test Lab | base | set timezone to UTC"
      community.windows.win_timezone:
        timezone: "UTC"

    - name: "Test Lab | base | disable Windows Defender real-time protection"
      ansible.windows.win_shell: |
        Set-MpPreference -DisableRealtimeMonitoring $true `
                         -DisableIOAVProtection $true `
                         -DisableBehaviorMonitoring $true `
                         -DisableBlockAtFirstSeen $true `
                         -DisableScriptScanning $true `
                         -MAPSReporting Disabled `
                         -SubmitSamplesConsent NeverSend `
                         -ErrorAction SilentlyContinue
      changed_when: false  # Set-MpPreference is idempotent at the OS level

    - name: "Test Lab | base | disable Defender service start (so a reboot can't re-enable it)"
      ansible.windows.win_service:
        name: WinDefend
        start_mode: disabled
        state: stopped
      failed_when: false  # Defender on some SKUs refuses stop while tamper-protect is on

    - name: "Test Lab | base | disable Windows Update auto-reboot"
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: NoAutoRebootWithLoggedOnUsers
        data: 1
        type: dword
        state: present

    - name: "Test Lab | base | disable Windows Update automatic install"
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: NoAutoUpdate
        data: 1
        type: dword
        state: present

    - name: "Test Lab | base | point non-DC hosts at tldc01 for DNS"
      ansible.windows.win_dns_client:
        adapter_names: "*"
        dns_servers:
          - "{{ testlab_dc_ip }}"
      when: "inventory_hostname not in groups['domain_controllers']"

    - name: "Test Lab | base | verify expected static IP is bound (DHCP reservation health check)"
      ansible.windows.win_shell: |
        $expected = '{{ ansible_host }}'
        $bound = (Get-NetIPAddress -AddressFamily IPv4 `
                  | Where-Object { $_.IPAddress -eq $expected }).IPAddress
        if (-not $bound) { Write-Error "Expected IP $expected not bound on this host" }
      changed_when: false

    - name: "Test Lab | base | open WinRM in the local firewall (idempotent rule add)"
      community.windows.win_firewall_rule:
        name: "WinRM HTTP testlab"
        localport: 5985
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true
