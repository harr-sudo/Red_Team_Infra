---
# Install Winlogbeat on a Windows lab host. SCAFFOLDED — Phase 3c will
# add full configuration of Sysmon/Security/PowerShell channels and
# Fleet-managed enrollment.

- name: "install_winlogbeat | download Winlogbeat MSI"
  ansible.windows.win_get_url:
    url: "https://artifacts.elastic.co/downloads/beats/winlogbeat/winlogbeat-{{ es_version }}-windows-x86_64.msi"
    dest: 'C:\Windows\Temp\winlogbeat.msi'

- name: "install_winlogbeat | install MSI"
  ansible.windows.win_package:
    path: 'C:\Windows\Temp\winlogbeat.msi'
    state: present

- name: "install_winlogbeat | configure winlogbeat.yml (placeholder)"
  ansible.windows.win_copy:
    dest: 'C:\Program Files\Winlogbeat\winlogbeat.yml'
    content: |
      # Generated by bolton_elastic_stack.
      # TODO (Phase 3c): expand with full Security/Sysmon/PowerShell config.
      winlogbeat.event_logs:
        - name: Security
        - name: Microsoft-Windows-Sysmon/Operational
        - name: Microsoft-Windows-PowerShell/Operational
      output.elasticsearch:
        hosts: ["https://{{ kibana_endpoint | regex_replace(':[0-9]+$', '') }}:{{ elasticsearch_port }}"]
        username: "elastic"
        password: "{{ es_password | default('CHANGEME') }}"
        ssl.verification_mode: none

- name: "install_winlogbeat | start Winlogbeat service"
  ansible.windows.win_service:
    name: winlogbeat
    state: started
    start_mode: auto
