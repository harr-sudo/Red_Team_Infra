---
# Install Filebeat on a Linux lab host. SCAFFOLDED — Phase 3c will add
# full module enablement (system, auditd, iptables) and Fleet-managed
# enrollment.

- name: "install_filebeat | install Filebeat package"
  ansible.builtin.apt:
    name: "filebeat={{ es_version }}"
    state: present
    update_cache: true
  become: true

- name: "install_filebeat | configure filebeat.yml (placeholder)"
  ansible.builtin.copy:
    dest: "/etc/filebeat/filebeat.yml"
    content: |
      # Generated by bolton_elastic_stack.
      # TODO (Phase 3c): enable proper Filebeat modules instead of inline inputs.
      filebeat.inputs:
        - type: filestream
          id: syslog
          paths: ["/var/log/syslog", "/var/log/auth.log"]
      output.elasticsearch:
        hosts: ["https://{{ kibana_endpoint | regex_replace(':[0-9]+$', '') }}:{{ elasticsearch_port }}"]
        username: "elastic"
        password: "{{ es_password | default('CHANGEME') }}"
        ssl.verification_mode: none
    mode: "0640"
    owner: root
    group: root
  become: true
  notify: restart filebeat

- name: "install_filebeat | enable + start Filebeat service"
  ansible.builtin.systemd:
    name: filebeat
    state: started
    enabled: true
  become: true
