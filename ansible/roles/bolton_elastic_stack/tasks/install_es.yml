---
# Install + configure single-node Elasticsearch.
#
# This task IS implemented end-to-end (subject to apt repo availability)
# but should be exercised on a real Ubuntu 22.04+ target before declaring
# Phase 3b production-ready.

- name: "install_es | add Elastic APT signing key"
  ansible.builtin.apt_key:
    url: "https://artifacts.elastic.co/GPG-KEY-elasticsearch"
    state: present
  become: true

- name: "install_es | add Elastic 8.x APT repository"
  ansible.builtin.apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present
    filename: "elastic-8.x"
  become: true

- name: "install_es | install Elasticsearch package"
  ansible.builtin.apt:
    name: "elasticsearch={{ es_version }}"
    state: present
    update_cache: true
  become: true

- name: "install_es | render single-node elasticsearch.yml"
  ansible.builtin.template:
    src: "elasticsearch.yml.j2"
    dest: "/etc/elasticsearch/elasticsearch.yml"
    owner: root
    group: elasticsearch
    mode: "0640"
  become: true
  notify: restart elasticsearch

- name: "install_es | ensure data dir exists with correct ownership"
  ansible.builtin.file:
    path: "{{ elastic_data_dir }}"
    state: directory
    owner: elasticsearch
    group: elasticsearch
    mode: "0750"
  become: true

- name: "install_es | enable + start Elasticsearch service"
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: "install_es | wait for Elasticsearch HTTP to come up"
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ elasticsearch_port }}"
    timeout: 180

- name: "install_es | reset elastic superuser password"
  ansible.builtin.command: >
    /usr/share/elasticsearch/bin/elasticsearch-reset-password
    -u elastic
    -i
    --batch
    --silent
  args:
    stdin: "{{ kibana_admin_password }}\n{{ kibana_admin_password }}\n"
  register: _es_reset_pw
  changed_when: _es_reset_pw.rc == 0
  no_log: true
  become: true

- name: "install_es | register elastic password as a host fact"
  ansible.builtin.set_fact:
    es_password: "{{ kibana_admin_password }}"
    cacheable: true
