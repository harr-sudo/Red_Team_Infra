---
# bolton_kerberoastable_svc — PATCH_REVERT entrypoint.
#
# Restores the lab to a Kerberoastable state by resetting the password to
# the known-weak value and re-enabling RC4 in msDS-SupportedEncryptionTypes.

- name: "Bolton kerberoast | patch_revert | reset password to the known-weak value"
  community.windows.win_domain_user:
    name: "{{ bolton_kerb_account_name }}"
    password: "{{ bolton_kerb_weak_password }}"
    update_password: always
    state: present
    password_never_expires: true
  no_log: true

- name: "Bolton kerberoast | patch_revert | re-enable RC4 in supported enc types"
  ansible.windows.win_shell: |
    Set-ADUser -Identity '{{ bolton_kerb_account_name }}' -Replace @{
      'msDS-SupportedEncryptionTypes' = {{ bolton_kerb_enctypes_vulnerable }}
    }

- name: "Bolton kerberoast | patch_revert | re-confirm SPN is in place"
  ansible.windows.win_shell: |
    $u = Get-ADUser -Identity '{{ bolton_kerb_account_name }}' -Properties servicePrincipalName
    $existing = @($u.servicePrincipalName)
    if ($existing -notcontains '{{ bolton_kerb_spn }}') {
      Set-ADUser -Identity '{{ bolton_kerb_account_name }}' `
                 -ServicePrincipalNames @{Add='{{ bolton_kerb_spn }}'}
    }
  changed_when: false
