---
# Ansible Inventory Example
# This file shows the structure of the inventory
# Actual inventory will be generated from Terraform outputs

all:
  children:
    c2_team_servers:
      hosts:
        c2-server-1:
          ansible_host: 10.0.10.5
          ansible_user: ec2-user
          ansible_ssh_private_key_file: ~/.ssh/red-team-keypair.pem
        c2-server-2:
          ansible_host: 10.0.11.5
          ansible_user: ec2-user
          ansible_ssh_private_key_file: ~/.ssh/red-team-keypair.pem
    
    proxy_redirectors:
      hosts:
        proxy-1:
          ansible_host: 54.123.45.67
          ansible_user: ec2-user
          ansible_ssh_private_key_file: ~/.ssh/red-team-keypair.pem
        proxy-2:
          ansible_host: 54.123.45.68
          ansible_user: ec2-user
          ansible_ssh_private_key_file: ~/.ssh/red-team-keypair.pem

  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

