<!DOCTYPE html>
<html data-theme="dark" lang="en">
<head>
    <meta charset="utf-8">
    <title>Deploy Journey — V3-Native Comparison (J1/J2/J3/Hybrid)</title>
    <link rel="stylesheet" href="/css/palette.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .compare-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 12px 20px;
            background: var(--bg-section);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .compare-bar h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.005em;
        }
        .compare-bar h1 .kicker {
            display: inline-block;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-left: 10px;
        }
        .compare-bar__controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .compare-bar__btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            font-family: inherit;
            transition: background-color 200ms ease, border-color 200ms ease;
        }
        .compare-bar__btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-light);
        }

        .compare-bar__variants {
            display: inline-flex;
            border: 1px solid var(--border);
            border-radius: 5px;
            overflow: hidden;
        }
        .compare-bar__variant {
            background: var(--bg-card);
            border: 0;
            border-left: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            transition: background-color 200ms ease, color 200ms ease;
        }
        .compare-bar__variant:first-child { border-left: 0; }
        .compare-bar__variant:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .compare-bar__variant.is-active {
            background: var(--bg-input);
            color: var(--text-primary);
            box-shadow: inset 0 -2px 0 var(--brand-light);
        }
        .compare-bar__variant.is-winner {
            color: var(--text-primary);
            font-weight: 700;
        }
        .compare-bar__variant.is-winner::before {
            content: "★";
            margin-right: 4px;
            color: var(--brand-light);
        }
        .compare-bar__variant:focus-visible {
            outline: none;
            box-shadow: inset 0 0 0 2px var(--brand-light);
        }

        .compare-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1px;
            background: var(--border);
            min-height: calc(100vh - 56px);
        }
        @media (max-width: 1599px) {
            .compare-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: auto auto;
            }
        }
        @media (max-width: 899px) {
            .compare-grid {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto auto auto auto;
            }
        }

        .compare-pane {
            background: var(--bg-body);
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 100vh;
        }
        @media (max-width: 1199px) {
            .compare-pane { min-height: 90vh; }
        }
        .compare-pane.is-dimmed {
            opacity: 0.45;
            transition: opacity 280ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .compare-pane__label {
            position: absolute;
            top: 12px;
            left: 16px;
            z-index: 50;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .compare-pane__label a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 200ms ease;
        }
        .compare-pane__label a:hover {
            color: var(--text-primary);
            text-decoration: underline;
        }

        .compare-pane iframe {
            border: 0;
            width: 100%;
            flex: 1;
            background: var(--bg-body);
        }

        .compare-bar__theme-state {
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0 6px;
        }
    </style>
</head>
<body>
    <div class="compare-bar">
        <h1>
            Deploy Journey — V3-Native
            <span class="kicker">Phase 1c · Hybrid winner</span>
        </h1>
        <div class="compare-bar__controls">
            <div class="compare-bar__variants" role="group" aria-label="Highlight a single journey">
                <button class="compare-bar__variant"
                        type="button"
                        data-variant="all"
                        aria-pressed="false">All</button>
                <button class="compare-bar__variant"
                        type="button"
                        data-variant="j1"
                        aria-pressed="false">J1 · Wizard</button>
                <button class="compare-bar__variant"
                        type="button"
                        data-variant="j2"
                        aria-pressed="false">J2 · Progressive</button>
                <button class="compare-bar__variant"
                        type="button"
                        data-variant="j3"
                        aria-pressed="false">J3 · Spec edit</button>
                <button class="compare-bar__variant is-winner is-active"
                        type="button"
                        data-variant="hybrid"
                        aria-pressed="true">Hybrid (winner)</button>
            </div>
            <button class="compare-bar__btn" id="theme-toggle">
                Toggle theme
                <span class="compare-bar__theme-state" id="theme-state">DARK</span>
            </button>
            <a class="compare-bar__btn" href="/preview/deploy-summary-compare.html">← Summary (Phase 1a)</a>
        </div>
    </div>

    <div class="compare-grid">
        <div class="compare-pane is-dimmed" data-pane="j1">
            <span class="compare-pane__label">
                J1 · Linear wizard
                <a href="/preview/deploy-journey-j1-wizard.html" target="_blank" rel="noopener">open ↗</a>
            </span>
            <iframe id="frame-j1" src="/preview/deploy-journey-j1-wizard.html" title="Journey J1 — Linear wizard"></iframe>
        </div>
        <div class="compare-pane is-dimmed" data-pane="j2">
            <span class="compare-pane__label">
                J2 · Progressive
                <a href="/preview/deploy-journey-j2-progressive.html" target="_blank" rel="noopener">open ↗</a>
            </span>
            <iframe id="frame-j2" src="/preview/deploy-journey-j2-progressive.html" title="Journey J2 — Progressive single page"></iframe>
        </div>
        <div class="compare-pane is-dimmed" data-pane="j3">
            <span class="compare-pane__label">
                J3 · Spec edit
                <a href="/preview/deploy-journey-j3-spec-edit.html" target="_blank" rel="noopener">open ↗</a>
            </span>
            <iframe id="frame-j3" src="/preview/deploy-journey-j3-spec-edit.html" title="Journey J3 — Spec list editor"></iframe>
        </div>
        <div class="compare-pane" data-pane="hybrid">
            <span class="compare-pane__label">
                ★ Hybrid · Winner
                <a href="/preview/deploy-journey-hybrid.html" target="_blank" rel="noopener">open ↗</a>
            </span>
            <iframe id="frame-hybrid" src="/preview/deploy-journey-hybrid.html" title="Journey Hybrid — Wizard + spec-edit review"></iframe>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const variantButtons = document.querySelectorAll('.compare-bar__variant');
        const panes = document.querySelectorAll('.compare-pane');

        function setVariant(variant) {
            variantButtons.forEach(b => {
                const isActive = b.dataset.variant === variant;
                b.classList.toggle('is-active', isActive);
                b.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });
            panes.forEach(p => {
                if (variant === 'all') {
                    p.classList.remove('is-dimmed');
                } else {
                    p.classList.toggle('is-dimmed', p.dataset.pane !== variant);
                }
            });
        }

        variantButtons.forEach(b => {
            b.addEventListener('click', () => setVariant(b.dataset.variant));
        });

        const themeBtn = document.getElementById('theme-toggle');
        const themeState = document.getElementById('theme-state');
        const frames = document.querySelectorAll('.compare-pane iframe');

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeState.textContent = theme.toUpperCase();
            frames.forEach(f => {
                try {
                    if (f.contentDocument && f.contentDocument.documentElement) {
                        f.contentDocument.documentElement.setAttribute('data-theme', theme);
                    }
                } catch (e) { /* cross-origin or not loaded */ }
            });
        }

        themeBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            applyTheme(current === 'light' ? 'dark' : 'light');
        });

        frames.forEach(f => {
            f.addEventListener('load', () => {
                const theme = document.documentElement.getAttribute('data-theme') || 'dark';
                try {
                    f.contentDocument.documentElement.setAttribute('data-theme', theme);
                } catch (e) { /* ignore */ }
            });
        });

        applyTheme('dark');

        // Default to the winner pane being selected (matches HTML initial state)
        setVariant('hybrid');
    })();
    </script>
</body>
</html>
