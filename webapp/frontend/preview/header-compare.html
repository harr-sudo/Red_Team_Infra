<!DOCTYPE html>
<html data-theme="dark" lang="en">
<head>
    <meta charset="utf-8">
    <title>Header Design Pilot — Baseline vs Taste-skill</title>
    <link rel="stylesheet" href="/css/palette.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Compare-view styles (anti-emoji, palette only, dual-theme).
           Temporary — slated for removal at D1 completion per Plan §17/§24. */
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-app);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .compare-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--bg-section);
            border-bottom: 1px solid var(--border);
        }
        .compare-bar h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .compare-bar__controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .compare-bar__btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-block;
            font-family: inherit;
        }
        .compare-bar__btn:hover { border-color: var(--text-secondary); }
        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border);
            min-height: calc(100vh - 50px);
        }
        .compare-pane {
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .compare-pane__label {
            position: absolute;
            top: 12px;
            left: 16px;
            z-index: 50;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-family: 'SF Mono', Monaco, monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .compare-pane iframe {
            border: 0;
            width: 100%;
            flex: 1;
        }
        @media (max-width: 1024px) {
            .compare-grid {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="compare-bar">
        <h1>Header Design Pilot — A/B</h1>
        <div class="compare-bar__controls">
            <button class="compare-bar__btn" id="theme-toggle">Toggle theme (both panes)</button>
            <a class="compare-bar__btn" href="/preview/header?variant=baseline">Baseline only</a>
            <a class="compare-bar__btn" href="/preview/header?variant=taste">Taste-skill only</a>
        </div>
    </div>
    <div class="compare-grid">
        <div class="compare-pane">
            <span class="compare-pane__label">Baseline (no skill)</span>
            <iframe src="/preview/header/baseline" title="Baseline header"></iframe>
        </div>
        <div class="compare-pane">
            <span class="compare-pane__label">Taste-skill (6/3/6)</span>
            <iframe src="/preview/header/taste" title="Taste-skill header"></iframe>
        </div>
    </div>
    <script>
        // Theme toggle that flips theme attr inside both iframes
        const toggle = document.getElementById('theme-toggle');
        toggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            document.querySelectorAll('iframe').forEach(f => {
                try {
                    f.contentDocument.documentElement.setAttribute('data-theme', next);
                } catch (e) { /* cross-origin or not loaded */ }
            });
        });
    </script>
</body>
</html>
