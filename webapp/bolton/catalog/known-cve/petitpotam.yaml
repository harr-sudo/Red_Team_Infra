# Bolt-on: PetitPotam — MS-EFSRPC Coercion (CVE-2021-36942)
# ----------------------------------------------------------
# Install reverts the mitigation registry changes that block anonymous
# EFSRPC access (RestrictReceiveAuthenticationPackages cleared, EFSRPC
# allowed for unauthenticated callers). An attacker can then call
# EfsRpcOpenFileRaw against a DC and coerce its machine account into
# authenticating to an attacker-controlled host — combined with NTLM
# relay to ADCS Web Enrollment (ESC8) this yields a DC certificate
# and full domain compromise.
#
# Patch installs KB5005413 (August 2021 OOB) and enables Extended
# Protection for Authentication on AD CS Web Enrollment +
# EnforceChannelBinding = 2 on the LSA so relayed authentications are
# rejected.
#
# Elastic rule UUIDs sampled from:
#   Research/elastic-detection-rules/rules/windows/credential_access_relay_ntlm_auth_via_http_spoolss.toml
#   Research/elastic-detection-rules/rules/windows/credential_access_dollar_account_relay.toml
#   Research/elastic-detection-rules/rules/windows/credential_access_dollar_account_relay_ntlm.toml

id: bolton.known-cve.petitpotam
slug: petitpotam
name: "PetitPotam — MS-EFSRPC Coercion (CVE-2021-36942)"
version: "1.0.0"
author: "Red Team Infra"
last_updated: 2026-05-19

category: known-cve
subcategory: efsrpc
tags:
  - cve-2021-36942
  - efsrpc
  - ntlm-relay
  - forced-authentication
  - adcs-esc8-pair
description: >
  Re-exposes the MS-EFSRPC unauthenticated coercion primitive on a domain
  controller. The August 2021 mitigation added EFSRPC to
  RestrictReceiveAuthenticationPackages and required authentication on the
  EFSRPC interface; this bolt-on clears those keys so EfsRpcOpenFileRaw is
  callable without credentials. Any network-reachable attacker can coerce
  the DC machine account to NTLM-authenticate to an arbitrary host. Paired
  with ADCS ESC8 (Web Enrollment HTTP NTLM endpoint), the relayed credential
  is exchanged for a domain-controller-class certificate.

cve:
  - "CVE-2021-36942"
references:
  - "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-36942"
  - "https://support.microsoft.com/en-us/topic/kb5005413"
  - "https://attack.mitre.org/techniques/T1187/"
  - "https://github.com/topotam/PetitPotam"

