    - rule_uuid: "341c6e18-9ef1-437e-bf18-b513f3ae2130"
      rule_name: "Potential Privilege Escalation via SUID/SGID Proxy Execution"
      rule_filename: "linux/privilege_escalation_potential_suid_sgid_proxy_execution.toml"
      coverage: full
