# Bolt-on: tar Wildcard Injection in Daily Cron
# ---------------------------------------------
# Install drops /etc/cron.daily/bolton-backup that does:
#   cd /tmp/bolton-data && tar czf /backup/bk.tgz *
# Shell wildcard expansion includes filenames starting with `-`, so any
# local user who can write to /tmp/bolton-data can drop files named
# `--checkpoint=1` and `--checkpoint-action=exec=sh shell.sh`. cron runs
# tar as root; tar interprets those as arguments and runs sh shell.sh
# as root — wildcard injection privilege escalation (T1059).
#
# Patch rewrites the script with `tar czf ... -- *` (POSIX `--` end-of-
# options sentinel) and seeds /etc/cron.daily/bolton-shellcheck-ci that
# greps cron.daily scripts for unguarded glob arguments.
#
# Elastic rule UUIDs sampled from:
#   Research/elastic-detection-rules/rules/linux/privilege_escalation_potential_wildcard_shell_spawn.toml
#   Research/elastic-detection-rules/rules/linux/persistence_cron_job_creation.toml

id: bolton.privilege-escalation.wildcard-injection-tar
slug: wildcard-injection-tar
name: "tar Wildcard Injection in Daily Cron Backup"
version: "1.0.0"
author: "Red Team Infra"
last_updated: 2026-05-23

category: privilege-escalation
subcategory: wildcard-injection
tags:
  - wildcard-injection
  - tar
  - cron
  - privilege-escalation
  - linux
description: >
  Installs /etc/cron.daily/bolton-backup that runs
  `cd /tmp/bolton-data && tar czf /backup/bk.tgz *` as root every day.
  Unguarded shell globbing means filenames starting with `-` are
  passed to tar as options. A local user who can write to the source
  directory drops `--checkpoint=1` and
  `--checkpoint-action=exec=sh shell.sh` files plus a payload `shell.sh`
  — tar then runs `sh shell.sh` as root on the next daily tick (MITRE
  T1059).

cve: []
references:
  - "https://attack.mitre.org/techniques/T1059/"
  - "https://www.gnu.org/software/tar/manual/html_section/Checkpoints.html"
  - "https://www.defensecode.com/public/DefenseCode_Unix_WildCards_Gone_Wild.txt"

