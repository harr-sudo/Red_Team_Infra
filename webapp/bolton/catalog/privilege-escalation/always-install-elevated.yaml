# Bolt-on: AlwaysInstallElevated MSI Privilege Escalation
# --------------------------------------------------------
# Two Group Policy registry values that together force Windows Installer
# to run any .msi as LocalSystem regardless of who invokes msiexec.
# Setting either alone is harmless; both together = SYSTEM-context code
# execution for any local user.

id: bolton.privilege-escalation.always-install-elevated
slug: always-install-elevated
name: "AlwaysInstallElevated MSI (Any user → SYSTEM)"
version: "1.0.0"
author: "Red Team Infra"
last_updated: 2026-05-22

category: privilege-escalation
subcategory: policy-misconfig
tags:
  - msi
  - windows-installer
  - registry-policy
  - local-privilege-escalation
description: >
  Sets the HKLM and HKCU registry values
  Software\Policies\Microsoft\Windows\Installer\AlwaysInstallElevated=1.
  When BOTH keys are set, msiexec runs every .msi as LocalSystem with no
  UAC consent. A standard user crafts an MSI payload (`msfvenom -f msi`)
  and runs `msiexec /quiet /qn /i payload.msi` to get a SYSTEM shell.
  This is a Group Policy misconfiguration, not a CVE — but it ships in
  hardening templates from less-than-rigorous sources every year.

cve: []
references:
  - "https://attack.mitre.org/techniques/T1548/002/"
  - "https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation"
  - "https://learn.microsoft.com/en-us/windows/win32/msi/alwaysinstallelevated"

