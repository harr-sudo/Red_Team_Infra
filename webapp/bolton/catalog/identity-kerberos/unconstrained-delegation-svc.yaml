# Bolt-on: Unconstrained Delegation Service Account
# --------------------------------------------------
# Creates a member-server computer-class delegation surface by setting
# TRUSTED_FOR_DELEGATION (userAccountControl bit 0x80000) on a service host.
# Combined with a coercion primitive (PetitPotam, PrinterBug), an attacker
# can cache a DC's TGT in LSASS and escalate to domain admin.
#
# Patch clears TRUSTED_FOR_DELEGATION and adds the host to the
# "Protected Users" group, which forbids unconstrained delegation.
#
# Elastic rule UUIDs are real:
#   Research/elastic-detection-rules/rules/windows/credential_access_seenabledelegationprivilege_assigned_to_user.toml
#   Research/elastic-detection-rules/rules/windows/credential_access_kerberos_coerce.toml

id: bolton.identity-kerberos.unconstrained-delegation-svc
slug: unconstrained-delegation-svc
name: "Unconstrained Delegation Service Account"
version: "1.0.0"
author: "Red Team Infra"
last_updated: 2026-05-19

category: identity-kerberos
subcategory: delegation
tags:
  - kerberos
  - delegation
  - unconstrained
  - privilege-escalation
  - token-impersonation
description: >
  Marks an existing member-server computer account as "Trust this computer
  for delegation to any service (Kerberos only)" by setting the
  TRUSTED_FOR_DELEGATION flag (userAccountControl bit 0x80000). Any
  authenticated principal coerced into authenticating to this host (via
  PetitPotam, PrinterBug, or DFS coercion) caches a forwardable TGT in
  LSASS. An attacker with local admin on the host can extract that TGT
  (Rubeus dump / mimikatz) and impersonate the principal — including a DC
  machine account, which leads to DCSync.

