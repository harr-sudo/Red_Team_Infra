# Bolt-on: SMB Signing Disabled
# ------------------------------
# Install disables SMB packet signing on member servers
# (RequireSecuritySignature = 0, EnableSecuritySignature = 0) so an NTLM
# relay attacker can hijack the server's auth and execute as the relayed
# user without packets being rejected for signature mismatch.
#
# DCs are excluded — the default GPO forces SMB signing on DCs and
# overriding that is its own dedicated lab scenario.
#
# Patch re-enables RequireSecuritySignature + EnableSecuritySignature
# and verifies via Get-SmbServerConfiguration.
#
# Elastic rule UUIDs sampled from:
#   Research/elastic-detection-rules/rules/windows/credential_access_dollar_account_relay_ntlm.toml
#   Research/elastic-detection-rules/rules/windows/credential_access_dollar_account_relay.toml
#   Research/elastic-detection-rules/rules/windows/credential_access_relay_ntlm_auth_via_http_spoolss.toml

id: bolton.protocol-network.smb-signing-disabled
slug: smb-signing-disabled
name: "SMB Signing Disabled"
version: "1.0.0"
author: "Red Team Infra"
last_updated: 2026-05-19

category: protocol-network
subcategory: smb
tags:
  - smb
  - ntlm-relay
  - signing
  - adversary-in-the-middle
description: >
  Disables SMB server-side packet signing on a member server so authentication
  bytes captured via NTLM coercion (PetitPotam, printer bug, file:// link
  rendering, etc.) can be relayed to this host without being rejected for
  signature failure. Sets HKLM\SYSTEM\CurrentControlSet\Services\
  LanmanServer\Parameters\RequireSecuritySignature = 0 and
  EnableSecuritySignature = 0. Domain controllers are excluded — DC signing
  is forced by the default DC GPO and altering it warrants its own descriptor.

